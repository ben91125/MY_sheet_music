<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的多樂器數位樂譜架 (PDF & 圖片雙支援)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a1a; /* 改為護眼深色底，降低長時間看 3C 的眼壓 */
            --sidebar-bg: #ffffff;
            --text-color: #212529;
            --primary-color: #4a6fa5;
            --sidebar-width: 320px;
            --video-width: 420px;
            --app-height: 100vh;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
        }

        html {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            height: var(--app-height);
            min-height: 100vh;
            min-height: 100dvh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            /* 避免 iPad 上不小心手勢縮放影響排版 */
            touch-action: manipulation; 
        }

        /* 左側側邊欄 */
        #sidebar {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s ease;
            z-index: 20;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #dee2e6;
        }

        .sidebar-header h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        #search-input {
            width: 100%;
            padding: 10px; /* 稍微放大方便 iPad 手指操作 */
            box-sizing: border-box;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1rem;
        }

        #score-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
            -webkit-overflow-scrolling: touch; /* 優化 iOS 滾動流暢度 */
        }

        #score-list li {
            padding: 18px 20px; /* 增大點擊熱區 */
            border-bottom: 1px solid #f1f3f5;
            cursor: pointer;
            transition: background 0.2s;
        }

        #score-list li:hover { background-color: #e9ecef; }
        #score-list li.active {
            background-color: #e8f0fe;
            border-left: 4px solid var(--primary-color);
        }

        .score-meta {
            font-size: 0.85rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 6px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75rem;
            background-color: #e7f5ff;
            color: #1c7ed6;
            border-radius: 3px;
        }
        .badge.instrument { background-color: #f3f0ff; color: #6f2dbd; }
        .badge.format-pdf { background-color: #fff0f6; color: #d6336c; }
        .badge.format-img { background-color: #e3fafc; color: #0c8599; }

        /* 右側主區域 */
        #main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            min-height: 0;
            position: relative;
        }

        #toolbar {
            padding: 12px 20px;
            background: #ffffff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
            transition: all 0.2s ease;
            z-index: 15;
        }

        .btn {
            padding: 8px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            min-height: 40px; /* 符合平板點擊熱區規範 */
        }
        .btn-focus { background: #2b8a3e; }
        
        /* 新增：選單切換按鈕 (平板直式專用) */
        #menu-toggle-btn {
            display: none;
            background: #495057;
        }

        /* 工作區佈局 */
        #workspace {
            display: flex;
            flex-grow: 1;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: #121212;
        }

        #viewer-container {
            flex-grow: 1;
            overflow: auto; /* 允許大圖滾動查看細節 */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a; 
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        #pdf-canvas, #img-viewer {
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            background: white;
            max-width: 100%;
            max-height: 100%;
            display: none;
            object-fit: contain;
        }

        /* 點擊翻頁熱區 */
        .page-ctrl-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 25%; /* 縮小熱區，避免跟中間點擊誤觸 */
            cursor: pointer;
            z-index: 10;
        }
        #prev-zone { left: 0; }
        #next-zone { right: 0; }

        #page-num-indicator {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 0.9rem;
            z-index: 11;
            pointer-events: none;
            letter-spacing: 1px;
        }

        /* YouTube 側邊欄 */
        #video-container {
            width: var(--video-width);
            background: #212529;
            border-left: 1px solid #343a40;
            display: none;
            flex-shrink: 0;
            padding: 15px;
            box-sizing: border-box;
            color: white;
            transition: width 0.3s ease;
            z-index: 14;
        }

        .video-title { margin-bottom: 12px; font-size: 0.95rem; font-weight: bold; color: #f8f9fa; }
        #practice-info {
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #343a40;
        }
        .practice-title {
            margin-bottom: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #f8f9fa;
        }
        .practice-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 6px 10px;
            margin-bottom: 12px;
            font-size: 0.85rem;
            line-height: 1.45;
        }
        .practice-label { color: #adb5bd; white-space: nowrap; }
        .practice-value { color: #f1f3f5; }
        .practice-notes {
            margin: 0;
            padding-left: 18px;
            color: #dee2e6;
            font-size: 0.85rem;
            line-height: 1.55;
        }
        .practice-notes li { margin-bottom: 6px; }
        #version-selector { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

        .version-btn {
            background: #495057; color: #dee2e6; border: none;
            padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer;
        }
        .version-btn.active { background: #22b8cf; color: white; font-weight: bold; }

        .video-wrapper {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            background: #000; border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* 側邊欄遮罩 (行動端/平板彈出時用) */
        #sidebar-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 19;
        }

        /* ────────────────────────────────────────────────────────
           📱 核心 RWD 媒體查詢：針對 iPad Pro 直式與中小型螢幕 (<= 1024px)
           ──────────────────────────────────────────────────────── */
        @media (max-width: 1024px) {
            #menu-toggle-btn {
                display: block; /* 顯示選單按鈕 */
            }

            /* 側邊欄改為絕對定位抽屜式 */
            #sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
                box-shadow: 5px 0 15px rgba(0,0,0,0.3);
            }

            #sidebar.open {
                transform: translateX(0);
            }

            /* 工作區重新佈局：改為上下排列，將空間100%留給樂譜 */
            #workspace {
                flex-direction: column;
            }

            #viewer-container {
                justify-content: flex-start;
                align-items: center;
                padding-top: max(12px, var(--safe-top));
                padding-right: max(12px, var(--safe-right));
                padding-bottom: max(16px, var(--safe-bottom));
                padding-left: max(12px, var(--safe-left));
            }

            /* 調整直式狀態下的樂譜渲染表現，讓樂譜盡量放大 */
            #pdf-canvas, #img-viewer {
                width: 100% !important;
                height: auto !important;
                max-height: none !important; /* 允許直式滾動看更多譜，或者符合高度 */
            }

            /* YouTube 區塊改到下方，並調整寬度為滿版 */
            #video-container {
                width: 100% !important;
                border-left: none;
                border-top: 1px solid #343a40;
                padding: 12px;
            }

            .video-wrapper {
                max-width: 560px; /* 避免影片在寬螢幕直式下過度放大 */
                margin: 0 auto;
            }
        }

        /* 專注模式樣式 (全螢幕乾淨練琴) */
        body.focus-mode #sidebar { transform: translateX(-100%) !important; width: 0 !important; overflow: hidden; border: none; }
        body.focus-mode #video-container { display: none !important; height: 0 !important; padding: 0 !important; overflow: hidden; border: none; }
        body.focus-mode #toolbar { height: 0; padding: 0; overflow: hidden; border: none; }
        body.focus-mode #sidebar-overlay { display: none !important; }
        body.focus-mode #viewer-container {
            padding-top: max(8px, var(--safe-top));
            padding-right: max(8px, var(--safe-right));
            padding-bottom: max(20px, var(--safe-bottom));
            padding-left: max(8px, var(--safe-left));
        }
        body.focus-mode #page-num-indicator {
            bottom: max(20px, calc(var(--safe-bottom) + 8px));
        }
    </style>
</head>
<body>

    <div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

    <div id="sidebar">
        <div class="sidebar-header">
            <h2>我的多樂器樂譜庫</h2>
            <input type="text" id="search-input" placeholder="搜尋曲名、樂器、作曲家...">
        </div>
        <ul id="score-list"></ul>
    </div>

    <div id="main-content">
        <div id="toolbar">
            <button id="menu-toggle-btn" class="btn" onclick="toggleSidebar(true)">☰ 樂譜庫</button>
            <button class="btn btn-focus" onclick="toggleFocusMode()">切換專注模式</button>
            <button class="btn" onclick="prevPage()">上一頁</button>
            <button class="btn" onclick="nextPage()">下一頁</button>
            <span id="current-title" style="font-weight: bold; margin-left: auto; color: #495057;">請選擇琴譜</span>
        </div>

        <div id="workspace">
            <div id="viewer-container">
                <div id="prev-zone" class="page-ctrl-zone" onclick="prevPage(); event.stopPropagation();"></div>
                <div id="next-zone" class="page-ctrl-zone" onclick="nextPage(); event.stopPropagation();"></div>
                
                <div style="position:absolute; width:50%; height:100%; z-index:5; cursor:pointer;" onclick="toggleFocusMode()"></div>

                <canvas id="pdf-canvas"></canvas>
                <img id="img-viewer" alt="琴譜圖片">
                
                <div id="page-num-indicator">0 / 0</div>
            </div>

            <div id="video-container">
                <div id="practice-info"></div>
                <div id="video-section-title" class="video-title">🎬 練習錄影版本</div>
                <div id="version-selector"></div>
                <div id="video-wrapper" class="video-wrapper">
                    <iframe id="youtube-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        const scoreData = window.scoreData || [];
        
        let currentMode = null; 
        let pdfDoc = null;
        let imgArray = [];
        let pageNum = 1;
        let totalPages = 0;
        let pageRendering = false;
        let pageNumPending = null;
        let currentActiveScore = null;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const imgViewer = document.getElementById('img-viewer');
        const scoreList = document.getElementById('score-list');
        const searchInput = document.getElementById('search-input');
        const currentTitle = document.getElementById('current-title');
        
        const videoContainer = document.getElementById('video-container');
        const versionSelector = document.getElementById('version-selector');
        const practiceInfo = document.getElementById('practice-info');
        const videoSectionTitle = document.getElementById('video-section-title');
        const videoWrapper = document.getElementById('video-wrapper');
        const youtubePlayer = document.getElementById('youtube-player');
        const pageIndicator = document.getElementById('page-num-indicator');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function syncViewportHeight() {
            const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
        }

        // 新增：控制平板側邊欄抽屜開關
        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
            } else {
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
            }
        }

        function renderCurrentPage() {
            if (currentMode === 'PDF') {
                canvas.style.display = 'block';
                imgViewer.style.display = 'none';
                renderPDFPage(pageNum);
            } else if (currentMode === 'IMG') {
                canvas.style.display = 'none';
                imgViewer.style.display = 'block';
                renderIMGPage(pageNum);
            }
            pageIndicator.textContent = `${pageNum} / ${totalPages}`;
        }

        function renderPDFPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(page => {
                const container = document.getElementById('viewer-container');
                const viewportRaw = page.getViewport({ scale: 1 });
                
                // RWD 核心計算：平板上以可視寬高都算進去，避免上下被裁切
                const widthScale = container.clientWidth / viewportRaw.width;
                const heightScale = container.clientHeight / viewportRaw.height;
                const perfectScale = Math.min(widthScale, heightScale);

                const viewport = page.getViewport({ scale: perfectScale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderTask = page.render({ canvasContext: ctx, viewport: viewport });
                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPDFPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });
        }

        function renderIMGPage(num) {
            imgViewer.src = imgArray[num - 1];
        }

        function queueRenderPage(num) {
            if (currentMode === 'PDF' && pageRendering) {
                pageNumPending = num;
            } else {
                renderCurrentPage();
            }
        }

        function prevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function nextPage() {
            if (pageNum >= totalPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        function toggleFocusMode() {
            if (!currentActiveScore) return;
            document.body.classList.toggle('focus-mode');
            // 關閉側邊欄遮罩
            toggleSidebar(false);
            setTimeout(() => { if (currentMode === 'PDF' && pdfDoc) renderPDFPage(pageNum); }, 310);
        }

        function escapeHTML(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getScoreSubtitle(score) {
            return [score.artist, score.composer, score.key].filter(Boolean).join(' / ');
        }

        function getPracticeFields(score) {
            return [
                ['演唱', score.artist],
                ['作曲', score.composer],
                ['作詞', score.lyricist],
                ['編曲/製譜', score.arranger],
                ['調性', score.key],
                ['拍號', score.timeSignature],
                ['速度', score.tempo ? `♩ = ${score.tempo}` : ''],
                ['出處', score.source]
            ].filter(([, value]) => value);
        }

        function renderPracticeInfo(score) {
            const fields = getPracticeFields(score);
            const notes = score.practiceNotes || [];

            if (fields.length === 0 && notes.length === 0) {
                practiceInfo.innerHTML = '';
                return false;
            }

            const fieldHTML = fields.length
                ? `<div class="practice-grid">${fields.map(([label, value]) => `
                    <div class="practice-label">${escapeHTML(label)}</div>
                    <div class="practice-value">${escapeHTML(value)}</div>
                `).join('')}</div>`
                : '';

            const notesHTML = notes.length
                ? `<ul class="practice-notes">${notes.map(note => `<li>${escapeHTML(note)}</li>`).join('')}</ul>`
                : '';

            practiceInfo.innerHTML = `
                <div class="practice-title">練習資訊</div>
                ${fieldHTML}
                ${notesHTML}
            `;
            return true;
        }

        function renderList(data) {
            scoreList.innerHTML = '';
            data.forEach(score => {
                const li = document.createElement('li');
                
                let formatBadge = '';
                if (score.pdfPath) {
                    formatBadge = `<span class="badge format-pdf">PDF 譜</span>`;
                } else if (score.filePaths && score.filePaths.length > 0) {
                    formatBadge = `<span class="badge format-img">圖片譜 (${score.filePaths.length}P)</span>`;
                }

                li.innerHTML = `
                    <div style="font-weight: 500;">${escapeHTML(score.title)}</div>
                    <div class="score-meta">${escapeHTML(getScoreSubtitle(score))}</div>
                    <div class="badge-container">${formatBadge}</div>
                `;
                li.onclick = () => {
                    selectScore(score, li);
                    toggleSidebar(false); // 點選樂譜後自動收回抽屜 (平板體驗優化)
                };
                scoreList.appendChild(li);
            });
        }

        function selectScore(score, element) {
            currentActiveScore = score;
            document.querySelectorAll('#score-list li').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            currentTitle.textContent = getScoreSubtitle(score)
                ? `${score.title} (${getScoreSubtitle(score)})`
                : score.title;

            if (score.pdfPath) {
                currentMode = 'PDF';
                const loadingTask = pdfjsLib.getDocument({
                    url: score.pdfPath,
                    disableAutoFetch: true,
                    disableStream: true
                });

                loadingTask.promise.then(pdfDoc_ => {
                    pdfDoc = pdfDoc_;
                    pageNum = 1;
                    totalPages = pdfDoc.numPages;
                    renderCurrentPage();
                }).catch(err => {
                    console.error("PDF 載入詳細錯誤:", err);
                    if (window.location.protocol === 'file:') {
                        alert("【PDF 載入失敗】\n偵測到您直接雙擊 HTML 檔開啟。\n這通常是瀏覽器的本機跨域安全限制（CORS）引起的。\n\n💡 建議解決方案：\n1. 請確認 config.js 中的檔名『絕對不能包含空白鍵』（例如改為 Mononoke_RuPiano.pdf）\n2. 建議使用 iPad 的 Safari 瀏覽器打開，Safari 對本機檔案的限制較寬鬆。");
                    } else {
                        alert("PDF 檔案加載失敗，請檢查 scores/ 資料夾中是否存在該檔案。");
                    }
                });
            } else if (score.filePaths && score.filePaths.length > 0) {
                currentMode = 'IMG';
                imgArray = score.filePaths;
                pageNum = 1;
                totalPages = imgArray.length;
                renderCurrentPage();
            }

            const hasPracticeInfo = renderPracticeInfo(score);
            const hasVideos = score.videos && score.videos.length > 0;

            if (hasVideos) {
                videoContainer.style.display = 'block';
                videoSectionTitle.style.display = 'block';
                versionSelector.style.display = 'flex';
                videoWrapper.style.display = 'block';
                renderVersionButtons(score.videos);
                switchVideo(score.videos[0].youtubeId, 0);
            } else {
                youtubePlayer.src = '';
                versionSelector.innerHTML = '';
                videoSectionTitle.style.display = 'none';
                versionSelector.style.display = 'none';
                videoWrapper.style.display = 'none';
                videoContainer.style.display = hasPracticeInfo ? 'block' : 'none';
            }
            
            // 針對 iPad 重新繪製尺寸
            setTimeout(() => { if (currentMode === 'PDF' && pdfDoc) renderPDFPage(pageNum); }, 100);
        }

        function renderVersionButtons(videos) {
            versionSelector.innerHTML = '';
            videos.forEach((video, index) => {
                const btn = document.createElement('button');
                btn.className = 'version-btn';
                btn.textContent = video.versionTitle;
                btn.onclick = () => switchVideo(video.youtubeId, index);
                versionSelector.appendChild(btn);
            });
        }

        function switchVideo(youtubeId, activeIndex) {
            youtubePlayer.src = `https://www.youtube.com/embed/${youtubeId}`;
            const buttons = versionSelector.getElementsByClassName('version-btn');
            for (let i = 0; i < buttons.length; i++) {
                buttons[i].classList.toggle('active', i === activeIndex);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        syncViewportHeight();
        window.addEventListener('orientationchange', syncViewportHeight);
        window.addEventListener('resize', syncViewportHeight);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncViewportHeight);
            window.visualViewport.addEventListener('scroll', syncViewportHeight);
        }

        // 監聽橫直式切換與縮放
        window.addEventListener('resize', () => {
            if (currentMode === 'PDF' && pdfDoc) queueRenderPage(pageNum);
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = scoreData.filter(score => {
                return [
                    score.title,
                    score.artist,
                    score.composer,
                    score.lyricist,
                    score.key,
                    score.source
                ].some(value => String(value || '').toLowerCase().includes(query));
            });
            renderList(filtered);
        });

        renderList(scoreData);
    </script>
</body>
</html>
